version: "3.9"

services:
  api:
    build: .
    container_name: otp-service
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev # Hot reload in dev

  redis:
    image: redis:7-alpine
    container_name: otp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
